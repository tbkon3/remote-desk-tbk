<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script src="/web/local-api.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestisci PC · RemoteDesk</title>
<link rel="icon" href="/web/icon.png">
<link rel="stylesheet" href="/web/style.css">
<style>
main{max-width:1100px;margin:auto;padding:20px}
header,nav,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header{justify-content:space-between}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0}
nav{margin:20px 0}nav button[aria-pressed="true"]{background:var(--hl);border-color:var(--acc)}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid var(--bd);overflow-wrap:anywhere}
[hidden]{display:none!important}
</style>
<script defer src="/web/session_ice.js"></script>
<script defer src="/web/manage.js"></script>
</head>
<body><main>
<header><div><h1>Gestisci PC</h1><span class="mut" id="target"></span></div>
<div class="actions"><span class="mut" id="path" hidden></span><button id="retry" hidden>Riconnetti</button><button id="disconnect">Disconnetti</button></div></header>
<nav aria-label="Sezioni inventario">
  <button data-section="shares" aria-pressed="true" disabled>Condivisioni</button>
  <button data-section="drives" aria-pressed="false" disabled>Unità mappate</button>
  <button data-section="services" aria-pressed="false" disabled>Servizi</button>
  <button data-section="apps" aria-pressed="false" disabled>Applicazioni</button>
</nav>
<section aria-labelledby="sectionTitle">
  <header><h2 id="sectionTitle">Condivisioni</h2><button id="refresh" disabled>Aggiorna elenco</button></header>
  <div id="intuneCatalog" hidden>
    <p><a href="https://intune.microsoft.com/" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">Apri Microsoft Intune per assegnare un’app</a></p>
    <p class="mut">Nel tenant aziendale scegli App → Tutte le app, seleziona l’app approvata e verifica il gruppo destinatario. Con l’assegnazione «Disponibile» l’utente avvia l’installazione dal Portale aziendale.</p>
  </div>
  <p class="mut" id="status" role="status">Connessione in corso…</p>
  <div class="scroll"><table hidden id="results" aria-labelledby="sectionTitle"><thead id="columns"></thead><tbody id="rows"></tbody></table></div>
</section>
</main></body>
</html>
