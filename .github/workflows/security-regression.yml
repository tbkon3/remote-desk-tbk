name: RemoteDesk regression tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path tests -Filter '*.cjs' | ForEach-Object FullName)
          node --test $tests
  turn-tls-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Installa le dipendenze sul runner temporaneo
        shell: bash
        run: |
          sudo systemctl mask --runtime coturn.service
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends coturn iproute2 openssl
          if systemctl is-active --quiet coturn.service; then exit 1; fi
          python -m pip install "$(awk '/^aiortc[<>=]/ {print; exit}' requirements.txt)"
      - name: Verifica due peer WebRTC con coturn su TLS in un namespace di loopback
        shell: bash
        run: sudo unshare --net -- bash tests/run_turn_tls_smoke.sh "$(command -v python)"

  windows-legacy-folder:
    name: Recover the original Windows service folder permissions
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - name: Verify the local repair against the released Windows updater
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'rd-legacy-signed.json'
          git show 70b260c46250fdbd38cf0eaf12ceb9cacc38f897:dist/latest.json | Set-Content -Encoding utf8 $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_legacy_acl_repair.py --legacy-zip dist/RemoteDesk-2.3.2.zip --legacy-manifest $manifest --candidate-zip dist/RemoteDesk-2.4.0.zip
