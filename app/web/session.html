<!doctype html>
<html lang="it">
<head>

<style>
body{display:flex;flex-direction:column;overflow:hidden;background:#000}
#tb{display:flex;gap:6px;align-items:center;padding:5px 8px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap;color:var(--fg)}
#tb select,#tb button{padding:4px 8px;font-size:13px}
#tb .nm{font-weight:600;margin-right:4px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tb .sp{flex:1}
#stats{font:11px ui-monospace,monospace;color:var(--mut)}
#body{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;outline:none;background:#000}
#stage.one{overflow:auto}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:default}
#stage.one video{position:static;width:auto;height:auto;max-width:none;object-fit:none;display:block}
#stage.view video{cursor:not-allowed}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#e5e7eb;background:#0b0f17e8;z-index:5;text-align:center;padding:20px}
#ov .big{font-size:18px}
#drop{position:absolute;inset:10px;border:3px dashed #60a5fa;border-radius:16px;background:#1e3a8a55;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none}
#fp{width:430px;max-width:60vw;background:var(--card);color:var(--fg);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
body.filesonly #fp{width:auto;max-width:none;flex:1;border:none}
body.filesonly #stage{display:none}
body.filesonly.pending #stage{display:block}body.filesonly.pending #fp{display:none}
#fp .hd{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
#fp .hd input{flex:1;min-width:120px;font:12px ui-monospace,monospace}
#fp .favs{display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--bd)}
#fp .favs button{font-size:12px;padding:2px 8px;border-radius:99px}
#list{flex:1;overflow:auto}
#list table{width:100%;border-collapse:collapse;font-size:13px}
#list td{padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
#list td.n{max-width:220px;overflow:hidden;text-overflow:ellipsis;cursor:default}
#list tr:hover{background:var(--hl)}
#list td.a{text-align:right}
#list td.a button{padding:1px 6px;font-size:12px;border:none;background:transparent}
#list td.a button:hover{background:var(--bd)}
#cp{width:340px;max-width:50vw;background:var(--card);color:var(--fg);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#cmsgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
.cb{max-width:88%;padding:7px 10px;border-radius:11px;white-space:pre-wrap;word-wrap:break-word;font-size:13px}
.cb .n{font-size:11px;color:var(--mut)}
.cb.me{align-self:flex-end;background:var(--acc);color:#fff}.cb.me .n{color:#dbeafe}
.cb.them{align-self:flex-start;background:var(--bg);border:1px solid var(--bd)}
#cform{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}
#cform textarea{flex:1;resize:none;height:40px;font-size:13px}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:4px}
#bAudio.on{background:var(--ok);border-color:var(--ok);color:#fff}
#xfers{max-height:30%;overflow:auto;border-top:1px solid var(--bd)}
.xf{padding:6px 8px;font-size:12px;border-bottom:1px solid var(--bd)}
.xf .bar{height:4px;background:var(--bd);border-radius:2px;margin-top:4px;overflow:hidden}
.xf .bar i{display:block;height:100%;background:var(--acc);width:0}
.xf.ok .bar i{background:var(--ok)}.xf.err .bar i{background:var(--bad);width:100%}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);width:min(540px,92vw)}
dialog textarea{width:100%;min-height:120px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>

<body>

  <span class="dot" id="dot"></span><span class="nm" id="nm">...</span>
  <select id="mon" class="hide" title="Monitor remoto"></select>
  <select id="quality" title="Qualita' video">

<div id="body">
  <div id="stage" tabindex="0">
    <video id="video" autoplay playsinline muted></video>
    <div id="drop" class="hide">Rilascia per inviare i file al PC remoto</div>
    <div id="ov"><div class="big" id="ovTxt">Connessione...</div><div class="mut" id="ovSub"></div>

  <aside id="fp" class="hide">
    <div class="hd">

</dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const TARGET = P.get('id') || '', MODE = P.get('mode') || 'control', NET = P.get('net');
const START_MON = P.has('mon') ? +P.get('mon') : null;   // usato dalle finestre "una per schermo"
let NAME = P.get('name') || TARGET.replace(/(\d{3})(?=\d)/g, '$1 ');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t, ms=3500){ const d = document.createElement('div'); d.className='toast'; d.textContent=t; document.body.append(d); setTimeout(()=>d.remove(), ms) }
async function post(p, b, timeout=10000){
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), timeout);
  try {
    const r = await fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b||{}), signal:controller.signal});
    const result = await r.json();
    if (!r.ok && !result.error) throw Error('Richiesta rifiutata');
    result.httpStatus = r.status;
    return result;
  } finally { clearTimeout(timer) }
}
const human = n => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : n < 1073741824 ? (n/1048576).toFixed(1) + ' MB' : (n/1073741824).toFixed(2) + ' GB';

$('nm').textContent = NAME; document.title = NAME + ' - RemoteDesk';
if (MODE === 'files') { document.body.classList.add('filesonly'); $('fp').classList.remove('hide') }
if (MODE !== 'control') document.querySelectorAll('.ctl').forEach(e => e.classList.add('hide'));
for (const id of ['quality','scale','bFull','bAudio','bChat']) $(id).classList.toggle('hide', MODE === 'files' || id === 'bAudio');

// =================================================================== connessione
let pc = null, ctl = null, mmc = null, fdc = null, perms = {control:false, files:false, clipboard:false};
let userClosed = false, everConnected = false, retryTimer = null, statsTimer = null, connecting = false;
let lease = null, proof = null, leaseTimer = null, pathTimer = null, attempt = 0;
let leaseActive = false, initialRoots = false;
let peerPresence = null, updateAnnounced = false, maintenance = null;
const updateDelays = [2000, 5000, 10000, 20000];

function overlay(txt, sub='', retry=false){
  document.body.classList.toggle('pending', !!txt);
  $('ov').classList.toggle('hide', !txt); $('ovTxt').textContent = txt || ''; $('ovSub').textContent = sub;
  $('bRetry').classList.toggle('hide', !retry);
}
function setDot(cls){ $('dot').className = 'dot ' + cls }
function send(m){ if (ctl && ctl.readyState === 'open') ctl.send(JSON.stringify(m)) }

function resetSession(){
  ++attempt; lease = proof = null; leaseActive = initialRoots = false;
  updateAnnounced = false;
  clearTimeout(retryTimer); clearTimeout(leaseTimer); clearTimeout(pathTimer); clearInterval(statsTimer);
  clearClipRequest();
  if ($('dlg').open) $('dlg').close();
  if (fdc) releaseFileChannel(fdc);
  const old = pc; pc = null; mmc = ctl = fdc = null;
  if (old) old.close();
  perms = {}; updateActions();
  $('video').srcObject = $('aud').srcObject = null;
  $('stats').textContent = ''; $('ctxt').value = ''; $('cmsgs').replaceChildren(); $('cBadge').classList.add('hide'); unread = 0;
  $('favs').replaceChildren(); $('list').replaceChildren(); $('list').entries = []; $('xfers').replaceChildren();
  cwd = incomingDir = ''; $('fPath').value = ''; $('fInput').value = '';
}

async function checkLease(my, token){
  try {
    const r = await post('/api/session/lease', {lease:token}, 4500);
    if (pc !== my || lease !== token) return false;
    if (r.ok !== true || !renewalMatches(r.proof, NET, TARGET, MODE) || (proof && proof.sid !== r.proof.sid)) throw Error('revocata');
    proof = r.proof;
    if (ctl?.readyState === 'open') send(proof);
    leaseTimer = setTimeout(() => checkLease(my, token), 5000);
    return true;
  } catch {
    if (pc === my && lease === token) {
      userClosed = true; resetSession(); setDot('bad');
      overlay('Autorizzazione scaduta o console non disponibile', 'Accedi di nuovo dalla console.', true);
    }
    return false;
  }
}

function releaseFileChannel(ch){
  for (const [rid, h] of [...FC.h]) { try { h.json?.({op:'err', rid, msg:'canale chiuso'}) } catch {} }
  for (const rid of [...FC.h.keys()]) FC.forget(rid);
  upQueue = Promise.resolve();
  ch.dispatchEvent(new Event('bufferedamountlow'));
}

function presenceOf(result){
  if (!Number.isSafeInteger(result.peer_presence) || result.peer_presence <= 0 ||
      typeof result.peer_pub !== 'string' || !/^[A-Za-z0-9+/]{43}=$/.test(result.peer_pub)) return null;
  return {key:result.peer_pub, stamp:result.peer_presence, version:result.peer_version || ''};
}

function waitAfterUpdate(){
  resetSession(); setDot('warn');
  const waiting = maintenance, remaining = waiting.until - performance.now();
  if (remaining <= 0) { lost('Il PC non è tornato disponibile entro tre minuti.', 'Controlla la rubrica e riprova.'); return }
  const delay = Math.min(remaining, updateDelays[Math.min(maintenance.tries++, updateDelays.length - 1)]);
  overlay('Il PC remoto si sta aggiornando', 'In attesa di una nuova presenza firmata.');
  retryTimer = setTimeout(() => {
    if (maintenance !== waiting || userClosed) return;
    if (performance.now() >= waiting.until) lost('Attesa del PC terminata.', 'Controlla la rubrica e riprova.');
    else connect();
  }, delay);
}

function updateInterrupted(){
  if (!peerPresence) { lost('Il PC remoto si sta aggiornando.', 'Dopo il riavvio riapri la sessione dalla rubrica.'); return }
  maintenance = {original:peerPresence, baseline:null, offline:false, tries:0, until:performance.now() + 180000};
  waitAfterUpdate();
}

function transportLost(message, detail, retry=false){
  if (updateAnnounced) updateInterrupted();
  else lost(message, detail, retry);
}

async function connect(){
  if (connecting) return; connecting = true;
  resetSession();
  const serial = attempt;
  try {
    if (!NET || !TARGET || !['view','control','files'].includes(MODE)) throw Error('Apri la sessione dalla rubrica.');
    overlay(everConnected ? 'Riconnessione...' : 'Connessione a ' + NAME + '...', 'In attesa della risposta del PC remoto');
    setDot('warn');
    const target = {nid:NET, to:TARGET, mode:MODE};
    if (maintenance) target.expected_pub = maintenance.original.key;
    const st = await post('/api/session/ice', target);
    if (serial !== attempt) return;
    if (maintenance && st.httpStatus === 409 && st.code === 'peer_offline') { maintenance.offline = true; waitAfterUpdate(); return }
    if (st.error) throw Error(st.error);
    const presence = presenceOf(st);
    if (maintenance) {
      const m = maintenance;
      if (!presence || presence.key !== m.original.key) throw Error('Identità del PC non confermata. Verifica la rubrica.');
      if (performance.now() >= m.until) { lost('Attesa del PC terminata.', 'Controlla la rubrica e riprova.'); return }
      const changedVersion = m.original.version && presence.version && presence.version !== m.original.version;
      if (changedVersion && presence.version.localeCompare(m.original.version, 'en', {numeric:true}) < 0)
        throw Error('Il PC ha annunciato una versione precedente. Verifica la rubrica.');
      const newPresence = m.baseline !== null && presence.stamp > m.baseline;
      if (!changedVersion && !newPresence && !(m.offline && presence.stamp >= m.original.stamp)) {
        m.baseline = Math.max(m.baseline || 0, m.original.stamp, presence.stamp);
        waitAfterUpdate(); return;
      }
    }
    peerPresence = presence;
    const my = new RTCPeerConnection({iceServers: st.ice});
    pc = my;
    if (MODE !== 'files') {
      const tr = my.addTransceiver('video', {direction:'recvonly'});
      // latenza minima: nessun buffer di riproduzione
      try { tr.receiver.playoutDelayHint = 0 } catch(e){}
      try { tr.receiver.jitterBufferTarget = 0 } catch(e){}
      if (MODE === 'control') {
        const ta = my.addTransceiver('audio', {direction:'recvonly'});
        try { ta.receiver.jitterBufferTarget = 0 } catch(e){}
      }
    }
    ctl = my.createDataChannel('ctl', {ordered:true});
    if (MODE === 'control') mmc = my.createDataChannel('mm', {ordered:false, maxRetransmits:0});
    if (MODE === 'files') {
      const files = my.createDataChannel('files', {ordered:true});
      fdc = files; files.binaryType = 'arraybuffer'; files.bufferedAmountLowThreshold = 256 * 1024;
      files.onmessage = e => {
        if (pc !== my || fdc !== files) return;
        try { FC.onmsg(e.data) } catch { lost('Risposta del canale file non valida') }
      };
      files.onclose = () => { if (pc === my && fdc === files) transportLost('Canale file chiuso') };
      files.onopen = () => { if (pc === my && fdc === files) firstRoots() };
    }
    my.ondatachannel = event => event.channel.close();
    ctl.onmessage = e => {
      if (pc !== my || typeof e.data !== 'string' || e.data.length > 150000) return;
      try { onCtl(JSON.parse(e.data)) } catch { lost('Messaggio di sessione non valido') }
    };
    ctl.onclose = () => { if (pc === my) transportLost('Canale di sessione chiuso') };
    ctl.onopen = () => {
      if (pc !== my) return;
      if (!proof) { lost('Autorizzazione della sessione mancante'); return }
      send(proof);
      if (MODE === 'files') return;
      applyQuality();
      if (START_MON !== null) send({t:'mon', i:START_MON});
      if (audioOn) send({t:'audio', on:true});
    };
    my.ontrack = e => {
      if (pc !== my || MODE === 'files' || (e.track.kind === 'audio' && MODE !== 'control')) { e.track.stop(); return }
      if (e.track.kind === 'audio') { $('aud').srcObject = new MediaStream([e.track]); $('aud').muted = !audioOn }
      else $('video').srcObject = new MediaStream([e.track]);
    };
    let discTimer = null;
    my.onconnectionstatechange = () => {
      if (pc !== my) return;
      const s = my.connectionState;
      if (s === 'connected') { clearTimeout(pathTimer); clearTimeout(discTimer); onConnected() }
      else if (s === 'disconnected') { setDot('warn'); discTimer = setTimeout(() => { if (pc === my && my.connectionState !== 'connected') transportLost(null, '', true) }, 6000) }
      else if (s === 'failed') transportLost('Connessione WebRTC non riuscita', 'Per le connessioni Internet verifica il server TURN su entrambi i PC.', true);
    };
    await my.setLocalDescription(await my.createOffer());
    const offer = await gatherRemoteDeskIce(my);
    if (pc !== my) return;
    if (maintenance && performance.now() >= maintenance.until) { lost('Attesa del PC terminata.'); return }
    if (maintenance) everConnected = false;
    const r = await post('/api/connect', {...target, sdp:offer}, 60000);
    if (pc !== my) return;
    if (maintenance && r.httpStatus === 409 && r.code === 'peer_offline') { maintenance.offline = true; waitAfterUpdate(); return }
    if (maintenance) { maintenance = null; everConnected = false }
    if (r.error) { lost(r.error); return }
    if (typeof r.lease !== 'string' || !r.lease) throw Error('Autorizzazione della sessione mancante');
    lease = r.lease;
    if (!await checkLease(my, lease)) return;
    overlay('Collegamento...', 'Negoziazione del percorso di rete');
    pathTimer = setTimeout(() => { if (pc === my) lost('Nessun percorso WebRTC disponibile', 'Per Internet verifica il server TURN su entrambi i PC.') }, 20000);
    await my.setRemoteDescription({type:'answer', sdp:r.sdp});
  } catch (e) {
    if (serial === attempt) lost(e.name === 'AbortError' ? 'Tempo di connessione scaduto' : e.message);
  } finally { connecting = false }
}

function onConnected(){
  everConnected = true; setDot('on');
  overlay(MODE === 'files' ? '' : 'In attesa dell\'immagine...', '');
  $('stage').focus();
  clearInterval(statsTimer); statsTimer = setInterval(updateStats, 2000);
}
$('video').addEventListener('loadeddata', () => { if (pc && pc.connectionState === 'connected') overlay('') });
$('video').addEventListener('resize', () => { if (pc && pc.connectionState === 'connected') overlay('') });

function lost(msg, sub, retry=false){
  maintenance = null;
  resetSession(); setDot('bad');
  if (userClosed) return;
  if (everConnected && retry) {
    overlay(msg || 'Connessione persa', [sub, 'Nuovo tentativo tra 5 secondi…'].filter(Boolean).join(' '), true);
    retryTimer = setTimeout(connect, 5000);
  } else {
    overlay(msg || 'Impossibile collegarsi', sub || '', true);
  }
}

// forma del puntatore del PC remoto (solo se posso controllarlo; in sola visione resta il divieto)
const CURSORS = new Set(['default','none','text','wait','crosshair','nwse-resize','nesw-resize','ew-resize','ns-resize','move','not-allowed','pointer','progress','help']);
let remoteCursor = 'default';
function applyCursor(){ $('video').style.cursor = perms.control ? remoteCursor : '' }

function updateActions(){
  const ctlOk = MODE === 'control' && perms.control === true;
  document.querySelectorAll('.ctl').forEach(el => el.classList.toggle('hide', !ctlOk));
  for (const opt of $('acts').options) {
    const allowed = !opt.value || (opt.value.startsWith('block') ? perms.block_input === true : perms.power === true);
    opt.disabled = opt.hidden = !allowed;
  }
  $('acts').classList.toggle('hide', !ctlOk || !(perms.power || perms.block_input));
  const cad = $('keys').querySelector('option[value="cad"]');
  cad.disabled = cad.hidden = !perms.secure_desktop;
  for (const id of ['clipPush','clipPull']) $(id).classList.toggle('hide', !ctlOk || !perms.clipboard);
  $('dlgClip').classList.toggle('hide', !ctlOk || !perms.clipboard);
  if (!perms.clipboard) clearClipRequest();
  const write = perms.files && perms.files_write === true, remove = perms.files && perms.files_delete === true;
  for (const id of ['fUpl','fMk','fInput']) $(id).disabled = !write;
  $('fileHint').textContent = write ? 'Trascina qui file e cartelle da caricare' : remove ? 'Lettura ed eliminazione' : 'Sola lettura';
  document.querySelectorAll('#list button[data-a="ren"]').forEach(b => b.hidden = !write || !remove);
  document.querySelectorAll('#list button[data-a="del"]').forEach(b => b.hidden = !remove);
}

function onCtl(m){
  if (m.t === 'info') {
    leaseActive = m.lease_active === true;
    perms = leaseActive ? {...m.perms, control:MODE === 'control' && m.perms?.control === true,
      clipboard:MODE === 'control' && m.perms?.clipboard === true, files:MODE === 'files' && m.perms?.files === true} : {};
    NAME = m.name || NAME; $('nm').textContent = NAME; document.title = NAME + ' - RemoteDesk';
    monitors = m.monitors;
    const sel = $('mon'); sel.innerHTML = '';

let lastBytes = 0, lastTs = 0;
async function updateStats(){
  if (!pc) return;
  const my = pc;
  let st; try { st = await my.getStats() } catch { return }
  if (pc !== my) return;
  let fps = 0, bytes = 0, w = 0, h = 0;
  const path = remoteDeskPath(st);
  st.forEach(r => {
    if (r.type === 'inbound-rtp' && r.kind === 'video') { fps = r.framesPerSecond || 0; bytes = r.bytesReceived; w = r.frameWidth; h = r.frameHeight }
  });
  const now = performance.now();
  const kbps = lastTs ? Math.round((bytes - lastBytes) * 8 / (now - lastTs)) : 0;
  lastBytes = bytes; lastTs = now;
  const latency = path.rtt === null ? '' : path.rtt + 'ms ';
  $('stats').textContent = (MODE !== 'files' ? `${w||0}x${h||0} ${Math.round(fps)}fps ${kbps}kbps ` : '') + latency + path.label;

let pendingClip = null;
const clipEncoder = new TextEncoder();
function clipAllowed(token) {

         perms.clipboard === true && ctl?.readyState === 'open';
}
function clearClipRequest(){
  clearTimeout(pendingClip?.timer); pendingClip = null; $('clipPull').disabled = false;
}
function validClip(text){
  return typeof text === 'string' && text.length <= 60000 && clipEncoder.encode(text).length <= 60000;
}
async function readLocalClipboard(token){
  if (!clipAllowed(token)) throw Error('Appunti non autorizzati');
  const r = await post('/api/clip/read', {lease:token});
  if (!clipAllowed(token) || r.error || !validClip(r.text)) throw Error(r.error || 'Lettura annullata o testo oltre 60.000 byte');
  return r.text;
}

    if (clipAllowed(token)) { send(msg); toast('Appunti inviati') }

};
$('clipPull').onclick = () => {

async function receiveClipboard(m){

  clearClipRequest();
  if (m.error || m.trunc) { toast(m.error ? String(m.error).slice(0, 200) : 'Appunti remoti troppo lunghi. Trasferimento annullato.'); return }
  if (!validClip(m.text)) { toast('Testo remoto oltre 60.000 byte o non disponibile'); return }
  try {
    const r = await post('/api/clip', {lease:request.lease, text:m.text});
    if (clipAllowed(request.lease)) toast(r.error || 'Appunti copiati su questo PC');
  } catch { toast('Scrittura degli appunti non riuscita') }
}

// =================================================================== file
const FC = {
  rid: 1, h: new Map(),
  next(){ return this.rid++ },
  send(o){ if (!fileReady()) throw Error('Canale file chiuso'); fdc.send(JSON.stringify(o)) },
  track(rid, handler){
    if (!fileReady() || (!this.h.has(rid) && this.h.size >= 32)) throw Error('Canale file occupato o chiuso');
    this.forget(rid); this.h.set(rid, handler); this.touch(rid);
  },
  touch(rid){
    const h = this.h.get(rid); if (!h) return;
    clearTimeout(h.timer); h.timer = setTimeout(() => {
      this.forget(rid); h.json({op:'err', rid, msg:'Operazione file scaduta'});
      if (fileReady()) this.send({op:'cancel', rid});
    }, 60000);
  },
  forget(rid){ clearTimeout(this.h.get(rid)?.timer); this.h.delete(rid) },
  req(o){ return new Promise((res, rej) => {
    const rid = this.next(); this.track(rid, {json(m){ FC.forget(rid); m.op === 'err' ? rej(new Error(m.msg)) : res(m) }});
    this.send({...o, rid});
  }) },
  onmsg(d){
    if (typeof d !== 'string') {
      if (!(d instanceof ArrayBuffer) || d.byteLength < 4 || d.byteLength > 65540) throw Error();
      const rid = new DataView(d).getUint32(0), h = this.h.get(rid); this.touch(rid);
      if (h?.bin) h.bin(new Uint8Array(d, 4)); return;
    }
    if (d.length > 1024 * 1024) throw Error();
    const m = JSON.parse(d), h = this.h.get(m.rid);
    if (h) { this.touch(m.rid); h.json(m) }
  }
};
let cwd = '', incomingDir = '';
function fileReady(ch=fdc){ return MODE === 'files' && !!lease && leaseActive && perms.files && ch && fdc === ch && ch.readyState === 'open' }

async function loadRoots(){

    incomingDir = r.incoming;

async function openDir(p){

    const r = await new Promise((res, rej) => {   // l'elenco puo' arrivare in piu' blocchi

        if (!Array.isArray(m.entries) || m.entries.length + acc.length > 5000) {

function xferRow(label){
  const d = document.createElement('div'); d.className = 'xf';
  d.innerHTML = `<div>${esc(label)} <span class="mut"></span></div><div class="bar"><i></i></div>`;
  $('xfers').prepend(d);

    prog(got, tot){ d.querySelector('i').style.width = (tot ? got / tot * 100 : 0) + '%'; d.querySelector('span').textContent = human(got) + (tot ? ' / ' + human(tot) : '') },
    done(msg){ d.classList.add('ok'); d.querySelector('i').style.width = '100%'; d.querySelector('span').textContent = msg || 'completato' },
    fail(msg){ d.classList.add('err'); d.querySelector('span').textContent = 'errore: ' + msg },

async function download(e){
  if (!fileReady()) return;
  const channel = fdc;
  if ([...FC.h.values()].some(h => h.bin)) { toast('Attendi il completamento del download'); return }
  let writer = null, wq = Promise.resolve();
  if (window.showSaveFilePicker) {
    try { writer = await (await showSaveFilePicker({suggestedName: e.n + (e.d ? '.zip' : '')})).createWritable() }
    catch (err) { if (err.name !== 'AbortError') toast('Impossibile aprire il file di destinazione'); return }
  }
  if (!fileReady(channel)) { if (writer) await writer.abort(); return }
  const row = xferRow('⬇ ' + e.n + (e.d ? '.zip' : ''));
  const rid = FC.next(); const chunks = []; let size = null, got = 0, name = e.n, queued = 0, failed = false;
  const fail = msg => {
    if (failed) return;
    failed = true; FC.forget(rid); row.fail(msg); chunks.length = 0;
    if (writer) writer.abort().catch(() => {});
  };
  FC.track(rid, {
    bin(u8){
      if (size === null || got + u8.length > size || queued + u8.length > 64 * 1024 * 1024) { fail('Dimensione o buffer del download oltre il limite'); return }
      got += u8.length;
      if (writer) {
        const c = u8.slice(); queued += c.length;
        wq = wq.then(async () => {
          if (!failed) await writer.write(c);
          queued -= c.length;
        }).catch(() => fail('Scrittura del file non riuscita'));
      } else chunks.push(u8.slice());
      row.prog(got, size);
    },
    async json(m){
      if (m.op === 'meta') {
        if (size !== null || !Number.isSafeInteger(m.size) || m.size < 0 || m.size > (writer ? 512 : 64) * 1024 * 1024) {
          fail('Dimensione non valida o oltre il limite del browser'); return;
        }
        size = m.size; name = m.name; row.prog(0, size);
      }
      else if (m.op === 'end') {
        if (size !== got) { fail('File incompleto'); return }
        if (writer) {
          await wq;
          if (!fileReady(channel) || failed) { fail('Sessione chiusa'); return }
          try { await writer.close() } catch { fail('Salvataggio del file non riuscito'); return }
        }
        else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks)); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 60000) }
        FC.forget(rid); row.done('scaricato (' + human(got) + ')');
      } else if (m.op === 'err') fail(m.msg);
    }
  });
  if (e.d) row.prog(0, 0);
  FC.send({op:'get', path:e.p, rid});
}

  return new Promise((resolve, reject) => {
    if (!fileReady(channel) || channel.bufferedAmount < 1048576) { resolve(); return }
    const timer = setTimeout(() => { cleanup(); reject(Error('Invio file scaduto')) }, 15000);
    function cleanup(){ clearTimeout(timer); channel.removeEventListener('bufferedamountlow', done) }
    function done(){ cleanup(); resolve() }
    channel.addEventListener('bufferedamountlow', done);
  });
}
async function doUpload(file, dir, rel, channel){
  if (file.size > 512 * 1024 * 1024) { toast('File oltre il limite di 512 MiB'); return }
  const row = xferRow('⬆ ' + (rel || file.name));
  const rid = FC.next();
  try {
    await new Promise((res, rej) => {
      FC.track(rid, {json(m){ if (m.op === 'ready') res(); else rej(Error(m.msg || 'Invio rifiutato')) }});
      FC.send({op:'put', rid, path:dir, name:rel || file.name, size:file.size});
    });
    if (!fileReady(channel)) throw Error('Canale chiuso');
    let result;
    const done = new Promise(res => FC.track(rid, {json(m){ result = m; FC.forget(rid); res(m) }}));
    const CH = 16384; let off = 0;
    const head = new Uint8Array(4); new DataView(head.buffer).setUint32(0, rid);
    while (off < file.size) {
      const buf = new Uint8Array(await file.slice(off, off + CH * 16).arrayBuffer());
      for (let i = 0; i < buf.length; i += CH) {
        if (result) throw Error(result.msg || 'Invio interrotto');
        if (channel.bufferedAmount > 1048576) await waitDrain(channel);
        if (!fileReady(channel)) throw Error('Canale chiuso');
        const part = buf.subarray(i, i + CH); const msg = new Uint8Array(4 + part.length); msg.set(head); msg.set(part, 4);
        channel.send(msg);
      }
      off += buf.length; FC.touch(rid); row.prog(off, file.size);
    }
    FC.send({op:'end', rid});
    const d = await done;
    if (d.op !== 'done') throw Error(d.msg || 'Invio non riuscito');
    row.done('salvato in ' + d.path);
  } catch (e) { FC.forget(rid); if (fileReady(channel)) FC.send({op:'cancel', rid}); row.fail(e.message) }
}
$('fUpl').onclick = () => $('fInput').click();
$('fInput').onchange = () => { for (const f of $('fInput').files) upload(f, cwd); $('fInput').value = ''; upQueue.then(() => openDir(cwd)) };

// drag & drop (anche cartelle)
let dragDepth = 0;
document.addEventListener('dragenter', e => { if (!e.dataTransfer.types.includes('Files') || !fileReady() || !perms.files_write) return; dragDepth++; $('drop').classList.remove('hide');
  $('drop').textContent = 'Rilascia per inviare a: ' + (!$('fp').classList.contains('hide') && cwd ? cwd : incomingDir || 'cartella Download remota') });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').classList.add('hide') } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; $('drop').classList.add('hide');
  if (!perms.files_write || !fileReady()) { toast('Scrittura file non autorizzata'); return }
  const channel = fdc;
  const dir = !$('fp').classList.contains('hide') && cwd ? cwd : '';
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  async function walk(entry, prefix){
    if (!fileReady(channel)) return;
    if (entry.isFile) { const f = await new Promise((res, rej) => entry.file(res, rej)); upload(f, dir, prefix + f.name, channel) }
    else if (entry.isDirectory) {
      const rd = entry.createReader(); let batch;
      do { batch = await new Promise((res, rej) => rd.readEntries(res, rej)); for (const c of batch) await walk(c, prefix + entry.name + '/') } while (fileReady(channel) && batch.length);
    }
  }
  if (entries.length) for (const en of entries) await walk(en, '');
  else for (const f of e.dataTransfer.files) upload(f, dir, '', channel);
  if ($('fp').classList.contains('hide')) toast('Invio in corso: apri "File" per vedere l\'avanzamento');
  upQueue.then(() => fileReady(channel) && cwd && openDir(cwd));
});

connect();
